name: Deploy to Production

on:
  push:
    branches:
      - main
      - feat/course-site
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to deploy (defaults to current branch)'
        required: false
        default: ''

concurrency:
  group: deploy-comprog-prod
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build course bundle
        run: npm run build

      - name: Run unit tests
        run: npm test

  deploy:
    name: Deploy to comprog.upsolve.study
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://comprog.upsolve.study
    steps:
      - name: Configure SSH deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run fast incremental server deploy
        env:
          TARGET_REF: ${{ github.event.inputs.ref || github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "git -C /srv/comprog fetch origin && git -C /srv/comprog checkout -f '${TARGET_REF}' && bash /srv/comprog/scripts/deploy.sh '${TARGET_REF}'"

      - name: Public smoke check
        run: |
          curl -fsSI https://comprog.upsolve.study/ | head -n 5
          curl -fsS https://comprog.upsolve.study/api/codeforces/leaderboard | head -c 200
          echo ""
