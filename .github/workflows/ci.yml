name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Unit Tests (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build course bundle
        run: npm run build

      - name: Run unit test suite
        run: npm test

      - name: Verify required dist artifacts
        run: |
          for f in index.html app.js app.css course.json course-cpp.json codeforces-problems.json; do
            test -s "dist/$f" || { echo "Missing or empty dist/$f"; exit 1; }
          done
          echo "All required dist artifacts verified."
